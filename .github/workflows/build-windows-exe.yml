
name: Build PDI Transfer Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pyautogui pyperclip keyboard pyinstaller

      - name: Build Windows EXE
        run: |
          pyinstaller --onefile --windowed --clean --name PDI_Extra_Transfer_Assistant PDI_Extra_Transfer_Assistant.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PDI-Extra-Transfer-Windows
          path: dist/PDI_Extra_Transfer_Assistant.exe
          retention-days: 30
