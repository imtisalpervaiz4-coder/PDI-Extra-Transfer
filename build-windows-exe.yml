name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python for the build machine only
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build standalone EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name PDI_Extra_Transfer_Assistant PDI_Extra_Transfer_Assistant.py
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDI-Extra-Transfer-Windows
          path: dist/PDI_Extra_Transfer_Assistant.exe
